# Lefthook configuration
# https://github.com/evilmartians/lefthook
assert_lefthook_installed: true
pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: bun oxlint --type-aware --type-check --fix {staged_files}
      stage_fixed: true
    - name: format
      run: bun oxfmt --write {staged_files}
      stage_fixed: true
