# Lefthook configuration
# https://github.com/evilmartians/lefthook
assert_lefthook_installed: true
pre-commit:
  parallel: true
  jobs:
    - name: lint
      run: bun lint:fix {staged_files}
      stage_fixed: true
    - name: format
      run: bun format {staged_files} --no-error-on-unmatched-pattern
      stage_fixed: true
