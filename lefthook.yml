# Lefthook configuration
# https://github.com/evilmartians/lefthook
assert_lefthook_installed: true
pre-commit:
  parallel: true
  jobs:
    - name: secrets
      run: nub run env:scan --staged
    - name: lint
      glob: '*.{js,jsx,ts,tsx}'
      run: nub run lint:fix
      stage_fixed: true
    - name: format
      glob: '*.{js,jsx,ts,tsx}'
      run: nub run format
      stage_fixed: true
